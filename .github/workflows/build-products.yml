name: Build product PDFs

# PDF content comes from products/*.md. Pushes to main rebuild verified review
# artifacts only. Publication is manual: review the artifact, manually dispatch
# with upload=true, then approve the protected Production environment gate.
on:
  pull_request:
    branches: [main]
    paths:
      - 'products/**'
      - 'public/icon.svg'
      - 'scripts/build-products.ts'
      - 'scripts/verify-product-pdfs.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-products.yml'
  push:
    branches: [main]
    paths:
      - 'products/**'
      - 'public/icon.svg'
      - 'scripts/build-products.ts'
      - 'scripts/verify-product-pdfs.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-products.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the verified PDFs to the private Supabase product-files bucket'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: build-products-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils
          sudo apt-get install -y google-chrome-stable || true
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build PDFs without publishing
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: npm run build:products -- --skip-upload

      - name: Upload verified PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-pdfs
          path: |
            .products-build/*.pdf
            .products-build/*.html
          if-no-files-found: error
          include-hidden-files: true

  upload:
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.upload == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download verified PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: product-pdfs
          path: .products-build

      - name: Verify downloaded PDFs
        run: |
          test -d .products-build
          test -n "$(find .products-build -maxdepth 1 -name '*.pdf' -print -quit)"

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Re-verify downloaded release artifacts
        run: npx tsx scripts/verify-product-pdfs.ts

      - name: Upload verified PDFs to private storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build:products -- --upload-existing
