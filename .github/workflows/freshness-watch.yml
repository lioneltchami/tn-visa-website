name: Freshness watch

# Opens/updates a GitHub Issue when fee literals drift from fees.json.
# Never auto-publishes policy content.
on:
  schedule:
    # Offset from :00 to reduce Actions schedule drops
    - cron: '20 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Check fee literal drift
        id: freshness
        continue-on-error: true
        run: npm run check:freshness

      - name: Upload report
        if: always() && hashFiles('freshness-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: freshness-report.md

      - name: Open or update GitHub Issue
        if: steps.freshness.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Fee freshness drift detected';
            const body = fs.existsSync('freshness-report.md')
              ? fs.readFileSync('freshness-report.md', 'utf8')
              : 'Fee literal drift detected. Re-run `npm run check:freshness` locally.';
            const labels = ['freshness', 'content'];

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'freshness',
              per_page: 20,
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Updated by freshness-watch run ${context.runId}\n\n${body}`,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.info(`Opened issue #${created.data.number}`);
            }
